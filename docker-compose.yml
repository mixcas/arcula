# Local dev stack — Postgres (§9).
#
# MinIO and Mailpit do NOT run as containers: the docker registry reachable
# from this machine does not host those images, and `dl.min.io` is gone —
# they run natively via Homebrew instead (API-MIGRATION-QWEN.md §15,
# amendments 2026-10-03). `scripts/stack-up.sh` starts them; this file is
# postgres only.
#
# Runtime is colima (the docker context on this machine): `colima start`
# before first use. `docker-compose up -d postgres` is idempotent.
# Nothing here is production: §10 deploys via CDK, never compose.

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: arcula
      POSTGRES_PASSWORD: arcula
      POSTGRES_DB: arcula
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcula -d arcula"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
